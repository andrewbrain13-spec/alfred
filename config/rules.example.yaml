# Alfred configuration — copy to config/rules.yaml and edit.
#
# Secrets: never put passwords here. Use ${ENV_VAR} and set the variable in the
# environment (see install/install-windows.md). Anything ${LIKE_THIS} is
# replaced from the environment when Alfred starts.

# ---------------------------------------------------------------------------
# Which mailbox to watch.
# ---------------------------------------------------------------------------
source:
  # Microsoft Graph (recommended). One-time Entra app registration; then
  # authenticate once and the refresh token is cached. See install/graph-setup.md.
  type: graph
  name: outlook
  tenant_id: ${ALFRED_TENANT_ID}
  client_id: ${ALFRED_CLIENT_ID}
  auth: device_code             # delegated; for your own mailbox
  folder: inbox

  # --- IMAP alternative (only if your tenant still allows IMAP basic auth) ----
  # type: imap
  # name: outlook
  # host: outlook.office365.com
  # port: 993
  # username: abrain@braingroup.com
  # auth: password
  # password: ${ALFRED_EMAIL_PASSWORD}   # an M365 *app password*
  # folder: INBOX
  # window: 25

poll_seconds: 60                 # how often to check for new mail
state_file: alfred_state.json    # remembers processed messages across restarts
log_file: alfred.log

# ---------------------------------------------------------------------------
# Rules: each is a trigger (match) -> one or more workflows.
# Conditions in `match` are ANDed. Text conditions are case-insensitive regex;
# a plain word acts as a substring match.
# ---------------------------------------------------------------------------
rules:
  # --- Automation #1: auto-approve Lever1/Prism leave requests (dry-run) -----
  # See automations/prism/README.md. Matched to the real Lever1 notification
  # (support@lever1.com, "Leave approval needed for ... (Brain Group)").
  # Starts in dry-run: reports what it WOULD approve. Set dry_run: false to go
  # live once you've confirmed a dry-run pass in prism_approvals.log.
  - name: "Prism/Lever1 leave -> approve (browser, dry-run)"
    match:
      from: "support@lever1\\.com"
      subject: "(?i)leave approval needed"
    stop_on_match: true
    workflows:
      - type: claude_agent
        task_file: automations/prism/approve_task.md
        mcp_config: mcp/playwright.json
        allowed_tools: ["mcp__playwright__browser_navigate", "mcp__playwright__browser_click", "mcp__playwright__browser_type", "mcp__playwright__browser_snapshot", "mcp__playwright__browser_wait_for"]
        dry_run: true
        output_to: prism_approvals.log

  # --- Automation #2: Piper NLC/RLC checklist -> OneDrive tracker (dry-run) --
  # See automations/piper/README.md. Appends a row to Table1 in
  # "NLC tracking.xlsx" with the shared link in the Link column.
  # TODO: add the real Piper sender to `from` once you share a sample email.
  - name: "Piper checklist -> tracker (dry-run)"
    match:
      subject: "(?i)new lease checklist|renewal lease checklist|\\bNLC\\b|\\bRLC\\b"
    stop_on_match: true
    workflows:
      - type: run_command
        command: ["python", "automations/piper/append_row.py"]
        env:
          ALFRED_DRY_RUN: "1"                # "0" to actually write the row
          PIPER_TRACKING_PATH: "NLC tracking.xlsx"
          PIPER_TABLE: "Table1"

  # --- Automation #3: FollowUpThen reminder -> draft nudge (drafts only) -----
  # See automations/followupthen/README.md. Finds the thread, checks for a
  # meaningful external reply, and if none, drafts "Any update on this?" with a
  # BCC to the weekday FollowUpThen address. It only ever DRAFTS; you send.
  - name: "FollowUpThen reminder -> draft nudge"
    match:
      from: "followupthen\\.com|fut\\.io"
    stop_on_match: true
    workflows:
      - type: run_command
        command: ["python", "automations/followupthen/process_fut.py"]
        env:
          ALFRED_DRY_RUN: "1"                # "0" to create the draft in Outlook
          FUT_INTERNAL_DOMAINS: "braingroup.com"
          FUT_NUDGE_BODY: "Any update on this?"

